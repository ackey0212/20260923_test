<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>郵便番号⇄住所変換</title>
<style>
  :root {
    color-scheme: light;
    --bg-0: #f5f5f7;
    --bg-1: #ffffff;
    --surface: rgba(255, 255, 255, 0.78);
    --surface-solid: #ffffff;
    --text: #1d1d1f;
    --text-secondary: #6e6e73;
    --text-tertiary: #86868b;
    --border: rgba(0, 0, 0, 0.08);
    --border-strong: rgba(0, 0, 0, 0.12);
    --accent: #0071e3;
    --accent-hover: #0077ed;
    --accent-press: #005bb5;
    --accent-tint: rgba(0, 113, 227, 0.1);
    --error: #ff3b30;
    --error-tint: rgba(255, 59, 48, 0.1);
    --shadow-card: 0 1px 2px rgba(0, 0, 0, 0.04), 0 12px 32px rgba(0, 0, 0, 0.08);
    --shadow-pill: 0 1px 4px rgba(0, 0, 0, 0.12);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg-0: #000000;
      --bg-1: #1c1c1e;
      --surface: rgba(28, 28, 30, 0.78);
      --surface-solid: #1c1c1e;
      --text: #f5f5f7;
      --text-secondary: #98989d;
      --text-tertiary: #6e6e73;
      --border: rgba(255, 255, 255, 0.1);
      --border-strong: rgba(255, 255, 255, 0.16);
      --accent: #0a84ff;
      --accent-hover: #3a9bff;
      --accent-press: #0866c6;
      --accent-tint: rgba(10, 132, 255, 0.16);
      --error: #ff453a;
      --error-tint: rgba(255, 69, 58, 0.16);
      --shadow-card: 0 1px 2px rgba(0, 0, 0, 0.3), 0 20px 48px rgba(0, 0, 0, 0.55);
      --shadow-pill: 0 1px 4px rgba(0, 0, 0, 0.4);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg-0: #000000;
    --bg-1: #1c1c1e;
    --surface: rgba(28, 28, 30, 0.78);
    --surface-solid: #1c1c1e;
    --text: #f5f5f7;
    --text-secondary: #98989d;
    --text-tertiary: #6e6e73;
    --border: rgba(255, 255, 255, 0.1);
    --border-strong: rgba(255, 255, 255, 0.16);
    --accent: #0a84ff;
    --accent-hover: #3a9bff;
    --accent-press: #0866c6;
    --accent-tint: rgba(10, 132, 255, 0.16);
    --error: #ff453a;
    --error-tint: rgba(255, 69, 58, 0.16);
    --shadow-card: 0 1px 2px rgba(0, 0, 0, 0.3), 0 20px 48px rgba(0, 0, 0, 0.55);
    --shadow-pill: 0 1px 4px rgba(0, 0, 0, 0.4);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    padding-block: 48px;
    padding-inline: 16px;
    padding-top: calc(48px + env(safe-area-inset-top, 0px));
    padding-bottom: calc(48px + env(safe-area-inset-bottom, 0px));
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif;
    background:
      radial-gradient(ellipse 900px 500px at 50% -10%, var(--accent-tint), transparent),
      var(--bg-0);
    color: var(--text);
    display: flex;
    justify-content: center;
    -webkit-font-smoothing: antialiased;
  }
  .app {
    width: 100%;
    max-width: 460px;
  }
  header {
    text-align: center;
    margin-bottom: 28px;
  }
  .eyebrow {
    font-size: 12px;
    font-weight: 590;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--accent);
    margin: 0 0 6px;
  }
  h1 {
    font-size: 28px;
    font-weight: 650;
    letter-spacing: -0.02em;
    line-height: 1.15;
    margin: 0 0 8px;
    text-wrap: balance;
  }
  .subtitle {
    font-size: 14px;
    color: var(--text-secondary);
    letter-spacing: -0.005em;
    margin: 0;
  }
  .card {
    position: relative;
    background: var(--surface);
    -webkit-backdrop-filter: blur(20px) saturate(1.6);
    backdrop-filter: blur(20px) saturate(1.6);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 20px;
    box-shadow: var(--shadow-card);
  }
  .tabs {
    position: relative;
    display: flex;
    background: rgba(120, 120, 128, 0.12);
    border-radius: 12px;
    padding: 3px;
    margin-bottom: 22px;
  }
  .tabs .indicator {
    position: absolute;
    top: 3px;
    left: 3px;
    height: calc(100% - 6px);
    width: calc(50% - 3px);
    background: var(--surface-solid);
    border-radius: 9px;
    box-shadow: var(--shadow-pill);
    will-change: transform;
  }
  .tab {
    position: relative;
    z-index: 1;
    flex: 1;
    padding: 8px 10px;
    text-align: center;
    background: none;
    border: none;
    border-radius: 9px;
    color: var(--text-secondary);
    cursor: pointer;
    font-size: 13px;
    font-weight: 590;
    letter-spacing: -0.005em;
    font-family: inherit;
    transition: color 0.25s ease;
  }
  .tab.active { color: var(--text); }
  .tab:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .panels { position: relative; }
  .panel {
    display: none;
  }
  .panel.active {
    display: block;
    animation: panel-in 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
  }
  @keyframes panel-in {
    from { opacity: 0; transform: translateY(6px) scale(0.99); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  label {
    display: block;
    font-size: 12px;
    font-weight: 510;
    color: var(--text-secondary);
    margin-bottom: 8px;
    letter-spacing: -0.005em;
  }
  .row {
    display: flex;
    gap: 8px;
  }
  input[type="text"] {
    flex: 1;
    min-width: 0;
    padding: 12px 14px;
    border: 1px solid var(--border-strong);
    border-radius: 11px;
    background: var(--bg-1);
    font-size: 16px;
    font-family: inherit;
    color: var(--text);
    transition: border-color 0.2s ease, box-shadow 0.2s ease;
  }
  input[type="text"]::placeholder { color: var(--text-tertiary); }
  input[type="text"]:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 4px var(--accent-tint);
  }
  button.search {
    padding: 12px 18px;
    border: none;
    border-radius: 11px;
    background: var(--accent);
    color: #fff;
    font-size: 14px;
    font-weight: 590;
    font-family: inherit;
    cursor: pointer;
    transition: background-color 0.2s ease, transform 0.12s cubic-bezier(0.2, 0.8, 0.2, 1);
  }
  button.search:hover { background: var(--accent-hover); }
  button.search:active { background: var(--accent-press); transform: scale(0.96); }
  button.search:disabled { background: var(--text-tertiary); cursor: not-allowed; transform: none; }
  button.search:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .result {
    margin-top: 16px;
    min-height: 20px;
    font-size: 14px;
    line-height: 1.6;
  }
  .result .status {
    color: var(--text-secondary);
    padding: 2px 2px;
  }
  .result .error {
    color: var(--error);
    background: var(--error-tint);
    padding: 10px 12px;
    border-radius: 10px;
  }
  .result .item {
    padding: 12px 14px;
    background: var(--bg-1);
    border: 1px solid var(--border);
    border-radius: 12px;
    margin-top: 8px;
    animation: item-in 0.45s cubic-bezier(0.2, 0.8, 0.2, 1) backwards;
  }
  .result .item:nth-child(1) { animation-delay: 0.02s; }
  .result .item:nth-child(2) { animation-delay: 0.06s; }
  .result .item:nth-child(3) { animation-delay: 0.1s; }
  .result .item:nth-child(4) { animation-delay: 0.14s; }
  @keyframes item-in {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .result .zip {
    font-weight: 590;
    color: var(--accent);
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.01em;
    margin-bottom: 3px;
    font-size: 13px;
  }
  .result .addr {
    color: var(--text);
    letter-spacing: -0.005em;
  }
  footer {
    margin-top: 18px;
    font-size: 11px;
    color: var(--text-tertiary);
    text-align: center;
    letter-spacing: 0.01em;
  }

  @media (prefers-reduced-motion: reduce) {
    .panel.active { animation: none; }
    .result .item { animation: none; }
    .tabs .indicator { transition: none !important; }
    button.search:active { transform: none; }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <p class="eyebrow">Japan Postal Lookup</p>
    <h1>郵便番号⇄住所変換</h1>
    <p class="subtitle">郵便番号と住所を、相互に一瞬で変換</p>
  </header>

  <div class="card">
    <div class="tabs" id="tabs">
      <div class="indicator" id="tab-indicator"></div>
      <button class="tab active" type="button" data-panel="zip-to-address">郵便番号→住所</button>
      <button class="tab" type="button" data-panel="address-to-zip">住所→郵便番号</button>
    </div>

    <div class="panels">
      <div class="panel active" id="zip-to-address">
        <label for="zip-input">郵便番号(ハイフンあり・なしどちらでも可)</label>
        <div class="row">
          <input type="text" id="zip-input" placeholder="例: 100-0001" inputmode="numeric" maxlength="8">
          <button class="search" id="zip-search-btn" type="button">検索</button>
        </div>
        <div class="result" id="zip-result"></div>
      </div>

      <div class="panel" id="address-to-zip">
        <label for="address-input">住所(都道府県から入力してください)</label>
        <div class="row">
          <input type="text" id="address-input" placeholder="例: 東京都千代田区千代田">
          <button class="search" id="address-search-btn" type="button">検索</button>
        </div>
        <div class="result" id="address-result"></div>
      </div>
    </div>

    <footer>郵便番号検索: zipcloud API / 住所検索: ZIPCODA API を利用</footer>
  </div>
</div>

<script>
  // --- Critically-damped spring for the segmented-control indicator ---
  function makeSpring(dampingRatio, response) {
    const angularFreq = (2 * Math.PI) / response;
    const stiffness = angularFreq * angularFreq;
    const damping = 2 * dampingRatio * angularFreq;
    return { stiffness, damping };
  }

  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const indicatorSpring = makeSpring(1.0, 0.35);

  const indicator = document.getElementById('tab-indicator');
  let indicatorX = 0;
  let indicatorTarget = 0;
  let indicatorVelocity = 0;
  let indicatorRAF = null;
  let lastFrameTime = null;

  function setIndicatorTarget(tabEl) {
    indicatorTarget = tabEl.offsetLeft - 3;
    if (reduceMotion) {
      indicatorX = indicatorTarget;
      indicatorVelocity = 0;
      indicator.style.transform = `translateX(${indicatorX}px)`;
      return;
    }
    if (!indicatorRAF) {
      lastFrameTime = null;
      indicatorRAF = requestAnimationFrame(stepIndicator);
    }
  }

  function stepIndicator(now) {
    if (lastFrameTime === null) lastFrameTime = now;
    const dt = Math.min((now - lastFrameTime) / 1000, 1 / 30);
    lastFrameTime = now;

    const displacement = indicatorX - indicatorTarget;
    const accel = -indicatorSpring.stiffness * displacement - indicatorSpring.damping * indicatorVelocity;
    indicatorVelocity += accel * dt;
    indicatorX += indicatorVelocity * dt;

    indicator.style.transform = `translateX(${indicatorX}px)`;

    if (Math.abs(displacement) < 0.25 && Math.abs(indicatorVelocity) < 0.5) {
      indicatorX = indicatorTarget;
      indicator.style.transform = `translateX(${indicatorX}px)`;
      indicatorRAF = null;
      return;
    }
    indicatorRAF = requestAnimationFrame(stepIndicator);
  }

  const tabs = document.querySelectorAll('.tab');
  const panels = document.querySelectorAll('.panel');
  tabs.forEach(tab => {
    tab.addEventListener('click', () => {
      tabs.forEach(t => t.classList.remove('active'));
      panels.forEach(p => p.classList.remove('active'));
      tab.classList.add('active');
      document.getElementById(tab.dataset.panel).classList.add('active');
      setIndicatorTarget(tab);
    });
  });

  window.addEventListener('load', () => {
    const activeTab = document.querySelector('.tab.active');
    indicatorX = activeTab.offsetLeft - 3;
    indicatorTarget = indicatorX;
    indicator.style.transform = `translateX(${indicatorX}px)`;
  });
  window.addEventListener('resize', () => {
    const activeTab = document.querySelector('.tab.active');
    indicatorX = activeTab.offsetLeft - 3;
    indicatorTarget = indicatorX;
    indicator.style.transform = `translateX(${indicatorX}px)`;
  });

  // --- Lookup logic (unchanged behavior, zipcloud + ZIPCODA APIs) ---
  function setLoading(resultEl, message) {
    resultEl.innerHTML = `<div class="status">${message}</div>`;
  }
  function setError(resultEl, message) {
    resultEl.innerHTML = `<div class="error">${message}</div>`;
  }

  const zipInput = document.getElementById('zip-input');
  const zipBtn = document.getElementById('zip-search-btn');
  const zipResult = document.getElementById('zip-result');

  async function searchByZip() {
    const raw = zipInput.value.trim().replace(/[‐－ー-]/g, '-').replace(/-/g, '');
    if (!/^\d{7}$/.test(raw)) {
      setError(zipResult, '7桁の郵便番号を入力してください(例: 1000001 または 100-0001)');
      return;
    }
    zipBtn.disabled = true;
    setLoading(zipResult, '検索中...');
    try {
      const res = await fetch(`https://zipcloud.ibsnet.co.jp/api/search?zipcode=${raw}`);
      if (!res.ok) throw new Error('通信に失敗しました');
      const data = await res.json();
      if (data.status !== 200 || !data.results) {
        setError(zipResult, data.message || '該当する住所が見つかりませんでした');
        return;
      }
      zipResult.innerHTML = data.results.map(r => `
        <div class="item">
          <div class="zip">〒${r.zipcode.replace(/(\d{3})(\d{4})/, '$1-$2')}</div>
          <div class="addr">${r.address1}${r.address2}${r.address3}</div>
        </div>
      `).join('');
    } catch (e) {
      setError(zipResult, 'エラーが発生しました。通信環境をご確認ください。');
    } finally {
      zipBtn.disabled = false;
    }
  }
  zipBtn.addEventListener('click', searchByZip);
  zipInput.addEventListener('keydown', e => { if (e.key === 'Enter') searchByZip(); });

  const addressInput = document.getElementById('address-input');
  const addressBtn = document.getElementById('address-search-btn');
  const addressResult = document.getElementById('address-result');

  // ZIPCODA is JSONP-only friendly; loading it via <script> avoids any CORS restriction on fetch().
  function jsonp(url, timeoutMs = 8000) {
    return new Promise((resolve, reject) => {
      const callbackName = `zipcoda_cb_${Date.now()}_${Math.floor(Math.random() * 1e6)}`;
      const script = document.createElement('script');
      let settled = false;

      const cleanup = () => {
        delete window[callbackName];
        script.remove();
        clearTimeout(timer);
      };
      const timer = setTimeout(() => {
        if (settled) return;
        settled = true;
        cleanup();
        reject(new Error('タイムアウトしました'));
      }, timeoutMs);

      window[callbackName] = data => {
        if (settled) return;
        settled = true;
        cleanup();
        resolve(data);
      };
      script.onerror = () => {
        if (settled) return;
        settled = true;
        cleanup();
        reject(new Error('APIへの通信に失敗しました'));
      };
      script.src = `${url}${url.includes('?') ? '&' : '?'}callback=${callbackName}`;
      document.head.appendChild(script);
    });
  }

  async function searchByAddress() {
    const value = addressInput.value.trim();
    if (!value) {
      setError(addressResult, '住所を入力してください');
      return;
    }
    addressBtn.disabled = true;
    setLoading(addressResult, '検索中...');
    try {
      const data = await jsonp(`https://zipcoda.net/api?address=${encodeURIComponent(value)}`);
      if (data.status !== 200 || !data.items || data.items.length === 0) {
        setError(addressResult, '該当する郵便番号が見つかりませんでした');
        return;
      }
      addressResult.innerHTML = data.items.map(item => {
        const zip = item.zipcode || '';
        const zipDisplay = /^\d{7}$/.test(zip) ? zip.replace(/(\d{3})(\d{4})/, '$1-$2') : zip;
        return `
          <div class="item">
            <div class="zip">〒${zipDisplay}</div>
            <div class="addr">${(item.pref || '')}${(item.address || '')}</div>
          </div>
        `;
      }).join('');
    } catch (e) {
      setError(addressResult, `エラーが発生しました(${e.message})。通信環境をご確認ください。`);
    } finally {
      addressBtn.disabled = false;
    }
  }
  addressBtn.addEventListener('click', searchByAddress);
  addressInput.addEventListener('keydown', e => { if (e.key === 'Enter') searchByAddress(); });
</script>
</body>
</html>
